name: Gradle CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build-test-package:
    name: Build, Test & Package (JDK 17)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build + run unit tests + coverage report
        run: ./gradlew clean build jacocoTestReport --console=plain

      - name: Upload executable JAR (deployment artifact)
        uses: actions/upload-artifact@v4
        with:
          name: student-management-jar
          path: build/libs/*.jar

      - name: Upload test & coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: test-and-coverage-reports
          path: |
            build/reports/tests/test
            build/reports/jacoco/test/html
